<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Word &amp; Character Counter Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0a0a0a;
            --glass:#1e1e1e;
            --glass-alpha:rgba(30,30,30,0.6);
            --accent:#4e9af1;
            --text:#e0e0e0;
            --shadow:0 8px 32px rgba(0,0,0,0.6);
        }
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }
        body{
            font-family:'Roboto',sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:20px;
        }
        h1{
            margin: 20px 0;
            font-weight:500;
            text-align:center;
            color: var(--accent);
        }
        .glass{
            background: var(--glass-alpha);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            width:100%;
            max-width:800px;
            margin: 10px 0;
            transition: all 0.3s ease;
        }
        .glass:hover{
            box-shadow: 0 12px 36px rgba(0,0,0,0.7);
        }
        textarea{
            width:100%;
            height:150px;
            resize:vertical;
            background: var(--glass);
            border:none;
            outline:none;
            color: var(--text);
            font-size:1rem;
            padding:15px;
            border-radius:12px;
            box-shadow: inset var(--shadow);
            transition: all 0.3s ease;
        }
        textarea:focus{
            box-shadow: inset 0 0 0 2px var(--accent);
        }
        .results{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
            justify-content:center;
        }
        .stat{
            flex:1 1 120px;
            background: var(--glass-alpha);
            border-radius:12px;
            padding:15px;
            text-align:center;
            transition: background 0.3s ease;
        }
        .stat:hover{
            background: var(--glass);
        }
        .stat .label{
            font-size:.9rem;
            opacity:0.8;
        }
        .stat .value{
            font-size:1.6rem;
            font-weight:500;
            margin-top:5px;
            transition: color 0.3s ease;
        }
        button{
            background: var(--accent);
            color:#fff;
            border:none;
            padding:10px 20px;
            border-radius:8px;
            cursor:pointer;
            font-size:1rem;
            margin-top:10px;
            transition: background .2s ease, transform .2s ease;
        }
        button:hover{
            background:#367acb;
            transform:scale(1.03);
        }
        #ad-slot-top, #ad-slot-bottom{
            width:100%;
            max-width:800px;
            height:90px;
            background: #2a2a2a;
            border: 2px dashed #555;
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#777;
            margin:10px 0;
            font-size:0.9rem;
        }
        @media (max-width:600px){
            .stat{
                flex:1 1 100%;
            }
        }
    </style>
</head>
<body>
    <div id="ad-slot-top">[Adsterra / Monetag - Top Banner Placeholder]</div>

    <h1>SEO Word &amp; Character Counter</h1>

    <div class="glass">
        <textarea id="inputText" placeholder="Paste or type your SEO content here..."></textarea>
        <div style="display:flex; justify-content:center;">
            <button id="clearBtn">Clear Text</button>
        </div>
    </div>

    <div class="glass results">
        <div class="stat">
            <div class="label">Characters (incl. spaces)</div>
            <div class="value" id="charTotal">0</div>
        </div>
        <div class="stat">
            <div class="label">Characters (no spaces)</div>
            <div class="value" id="charNoSpace">0</div>
        </div>
        <div class="stat">
            <div class="label">Words</div>
            <div class="value" id="wordCount">0</div>
        </div>
        <div class="stat">
            <div class="label">Reading Time (≈)</div>
            <div class="value" id="readTime">0 sec</div>
        </div>
    </div>

    <div id="ad-slot-bottom">[Adsterra / Monetag - Bottom Banner Placeholder]</div>

    <script>
        const input = document.getElementById('inputText');
        const charTotalEl = document.getElementById('charTotal');
        const charNoSpaceEl = document.getElementById('charNoSpace');
        const wordCountEl = document.getElementById('wordCount');
        const readTimeEl = document.getElementById('readTime');
        const clearBtn = document.getElementById('clearBtn');

        function updateStats(){
            const text = input.value;
            const totalChars = text.length;
            const charsNoSpace = text.replace(/\s/g,'').length;
            const words = text.trim().split(/\s+/).filter(w=>w.length>0);
            const wordCount = words.length;
            const readingTimeSec = Math.ceil(wordCount / 200 * 60) || 0; // avg 200 wpm

            charTotalEl.textContent = totalChars;
            charNoSpaceEl.textContent = charsNoSpace;
            wordCountEl.textContent = wordCount;
            readTimeEl.textContent = readingTimeSec ? `${readingTimeSec} sec` : '0 sec';
        }

        input.addEventListener('input', updateStats);
        clearBtn.addEventListener('click', () => { input.value=''; updateStats(); });

        // Initial call
        updateStats();
    </script>
</body>
</html>
